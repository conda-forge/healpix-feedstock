schema_version: 1

context:
  name: healpix
  version: "2025.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/healpix-${{ version }}.tar.gz
  sha256: 733f16f30c15d911c8209f4045f0b0934e5fcafa63b8b39d62e425a036adccea

build:
  number: 4
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: numpy
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - numpy
    - setuptools
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - healpix
      pip_check: true

about:
  summary: Python package for HEALPix discretisation of the sphere
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://github.com/ntessore/healpix

extra:
  recipe-maintainers:
    - beckermr
